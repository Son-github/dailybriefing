name: dailybriefing

# Local development stack. AWS/Terraform is intentionally not involved here.
# Optional secrets are loaded from backend/.env and backend/.env.local (later wins).
x-backend-common: &backend-common
  init: true
  restart: unless-stopped
  env_file:
    - path: ./backend/.env
      required: false
    - path: ./.env
      required: false
    - path: ./backend/.env.local
      required: false
  environment:
    SPRING_PROFILES_ACTIVE: dev
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dashboard}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sonny}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
    APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    CORS_ALLOWED_ORIGINS: http://localhost:3000
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - backend-net

x-backend-healthcheck: &backend-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-sonny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net

  auth-service:
    <<: *backend-common
    build:
      context: ./backend/auth-service
    ports:
      - "8081:8081"
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8081'"]

  exchange-service:
    <<: *backend-common
    build:
      context: ./backend/exchange-service
    ports:
      - "8082:8082"
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8082'"]

  weather-service:
    <<: *backend-common
    build:
      context: ./backend/weather-service
    ports:
      - "8083:8083"
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8083'"]

  news-service:
    <<: *backend-common
    build:
      context: ./backend/news-service
    ports:
      - "8084:8084"
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8084'"]

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      weather-service:
        condition: service_healthy
      news-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - backend-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - backend-net

networks:
  backend-net:

volumes:
  pgdata:
