events {}

http {
  server {
    listen 8080;

    # Docker DNS를 주기적으로 다시 조회해 개별 백엔드 재빌드 후에도 502가 나지 않게 한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;  # ✅ 핵심

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'OK';
    }

    location ^~ /auth/ {
      set $auth_upstream http://auth-service:8081;
      proxy_pass $auth_upstream$request_uri;
    }

    # /exchange 로 오면 바로 upstream으로 넘기고, 절대 redirect 하지 않게
    location = /exchange {
      set $exchange_upstream http://exchange-service:8082;
      proxy_pass $exchange_upstream$request_uri;
    }

    location ^~ /exchange/ {
      set $exchange_upstream http://exchange-service:8082;
      proxy_pass $exchange_upstream$request_uri;
    }

    location ^~ /weather/ {
      set $weather_upstream http://weather-service:8083;
      proxy_pass $weather_upstream$request_uri;
    }

    location ^~ /news/ {
      set $news_upstream http://news-service:8084;
      proxy_pass $news_upstream$request_uri;
    }
  }
}
