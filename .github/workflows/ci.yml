name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: node scripts/test-spa-router.mjs && python3 scripts/check-infra.py && python3 scripts/scan-secrets.py && python3 scripts/test-deploy-backend.py
      - run: ./gradlew test integrationTest bootJar
        working-directory: backend
      - name: Disposable local CI settings (no provider keys)
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          p=Path('.env')
          s=p.read_text()
          s='\n'.join('JWT_SECRET='+secrets.token_urlsafe(48) if line.startswith('JWT_SECRET=') else 'DATA_MODE=DEMO' if line.startswith('DATA_MODE=') else line for line in s.splitlines())+'\n'
          p.write_text(s)
          PY
      - run: docker compose build && docker compose up -d --wait
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            backend/build/reports/tests
            frontend/playwright-report
            frontend/test-results
      - run: docker compose down
        if: always()
  aiops:
    runs-on: ubuntu-latest
    # AWS OIDC/계정 Key를 부여하지 않습니다. 모든 외부 API는 Mock으로 검사합니다.
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            lambda/aiops/requirements.txt
            lambda/aiops/requirements-dev.txt
      - run: |
          python -m pip install --require-hashes -r lambda/aiops/requirements.txt
          python -m pip install -r lambda/aiops/requirements-dev.txt
      - run: python -m ruff check lambda/aiops && python -m ruff format --check lambda/aiops
      - run: python -m pytest lambda/aiops --junitxml=lambda/aiops/build/pytest.xml
      - run: bash scripts/build_aiops.sh
      - name: Import packaged Lambda in matching Linux Python runtime
        run: |
          unzip -q lambda/aiops/build/aiops.zip -d /tmp/aiops-import-check
          PYTHONPATH=/tmp/aiops-import-check python -c 'import handler; assert callable(handler.lambda_handler)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiops-test-results
          path: lambda/aiops/build/pytest.xml
