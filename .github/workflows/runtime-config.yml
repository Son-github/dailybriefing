name: runtime-config
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드만 변경합니다. LIVE는 API 검증 후 적용합니다.'
        required: true
        default: LIVE
        type: choice
        options: [LIVE, STATIC_DEMO]
permissions:
  contents: read
concurrency:
  group: aws-application-deployment
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment: backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      BACKEND_ROLE_ARN: ${{ vars.BACKEND_ROLE_ARN }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      PUBLIC_KAKAO_MAP_KEY: ${{ vars.PUBLIC_KAKAO_MAP_KEY }}
      RUNTIME_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - name: Check runtime variables
        run: |
          python3 scripts/check-deploy-env.py runtime
          if [ "$RUNTIME_MODE" = LIVE ] && [ -z "$PUBLIC_KAKAO_MAP_KEY" ]; then
            echo 'PUBLIC_KAKAO_MAP_KEY에 공개 JavaScript 지도 키가 필요합니다.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Verify account and existing targets
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution --id "$CF_DISTRIBUTION_ID" --query Distribution.Status --output text
          aws s3api head-object --bucket "$FRONTEND_BUCKET" --key runtime-config.json > /dev/null
      - name: Verify API before LIVE activation
        if: inputs.mode == 'LIVE'
        run: node scripts/smoke-api.mjs "$FRONTEND_URL"
      - name: Update runtime configuration only
        env:
          ALLOW_AWS_MUTATIONS: I_UNDERSTAND_COSTS
        run: python3 scripts/set-runtime.py --mode "$RUNTIME_MODE" --bucket "$FRONTEND_BUCKET" --distribution "$CF_DISTRIBUTION_ID"
      - name: Verify public runtime configuration
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(os.environ['FRONTEND_URL'] + '/runtime-config.json', headers={'Cache-Control': 'no-cache'})
          with urllib.request.urlopen(request, timeout=15) as response:
              config = json.load(response)
          live = os.environ['RUNTIME_MODE'] == 'LIVE'
          if config.get('mode') != os.environ['RUNTIME_MODE'] or config.get('liveEnabled') is not live:
              raise SystemExit('공개 실행 모드가 요청한 설정과 다릅니다.')
          if live and config.get('kakaoMapKey') != os.environ['PUBLIC_KAKAO_MAP_KEY']:
              raise SystemExit('공개 지도 키 반영 확인 실패. 키 원문은 출력하지 않습니다.')
          print('PASS: 실행 설정 반영 확인 (키 원문 생략)')
          PY
          echo "실행 설정을 $RUNTIME_MODE 모드로 변경했습니다. 이미지 빌드·ECS 배포·Terraform 실행은 하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
