name: backend-deploy
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
      - 'scripts/check-deploy-env.py'
      - 'scripts/deploy-backend.py'
      - 'scripts/smoke-api.mjs'
      - 'scripts/set-runtime.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aws-application-deployment
  cancel-in-progress: false
jobs:
  deploy:
    # 이미지 업로드는 ECS 없이도 실행합니다. 서버 배포는 별도 플래그로 활성화합니다.
    # 인프라를 자동 생성/삭제하거나 Terraform을 호출하지 않습니다.
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment: backend
    # 빌드 OS의 자동 메이저 변경을 피하고 현재 검증된 Ubuntu를 사용합니다.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_URL: ${{ vars.ECR_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_FAMILY: ${{ vars.TASK_FAMILY }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
      PUBLIC_KAKAO_MAP_KEY: ${{ vars.PUBLIC_KAKAO_MAP_KEY }}
      BACKEND_ROLE_ARN: ${{ vars.BACKEND_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
      - name: Check upload safety and image variables
        run: python3 scripts/scan-secrets.py && python3 scripts/check-deploy-env.py backend-image
      - name: Check deployment variables when server deployment is enabled
        if: vars.AWS_BACKEND_DEPLOY_ENABLED == 'true'
        run: python3 scripts/check-deploy-env.py backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test integrationTest bootJar
        working-directory: backend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Check account and existing ECR repository
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws ecr describe-repositories --repository-names "${ECR_URL#*/}" > /dev/null || { echo 'ECR이 없습니다. Main 1차 수동 인프라 생성이 필요합니다.'; exit 1; }
      - name: Check existing ECS when server deployment is enabled
        if: vars.AWS_BACKEND_DEPLOY_ENABLED == 'true'
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json > /tmp/services.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/services.json'))
          if d.get('failures') or not d.get('services') or d['services'][0]['status'] != 'ACTIVE':
              raise SystemExit('ECS 서비스가 없습니다. Main 2차 수동 인프라 생성 후 다시 실행하세요.')
          PY
      - name: Build and push immutable image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
          tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 -t "$ECR_URL:$tag" backend
          docker push "$ECR_URL:$tag"
          digest=$(aws ecr describe-images --repository-name "${ECR_URL#*/}" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'ECR 이미지 digest 확인 실패'; exit 1; }
          echo "IMAGE_URI=$ECR_URL@$digest" >> "$GITHUB_ENV"
          {
            echo '## Backend 이미지 업로드 완료'
            echo "- Commit: $GITHUB_SHA"
            echo "- Tag: $tag"
            echo "- Image: $ECR_URL@$digest"
            echo ''
            echo 'Terraform 최초 Backend 생성 시 아래 값을 image_digest에 입력하세요.'
            echo '```hcl'
            echo "image_digest = \"$digest\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explain image-only result
        if: vars.AWS_BACKEND_DEPLOY_ENABLED != 'true'
        run: echo '이미지 업로드만 완료했습니다. ECS 배포와 LIVE 전환은 실행하지 않았습니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy revision and verify readiness
        if: vars.AWS_BACKEND_DEPLOY_ENABLED == 'true'
        env:
          ALLOW_AWS_MUTATIONS: I_UNDERSTAND_COSTS
        run: |
          python3 scripts/deploy-backend.py
          node scripts/smoke-api.mjs "$FRONTEND_URL"
          python3 scripts/set-runtime.py --mode LIVE --bucket "$FRONTEND_BUCKET" --distribution "$CF_DISTRIBUTION_ID"
