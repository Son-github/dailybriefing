server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://dapi.kakao.com https://*.daumcdn.net; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location /actuator/health { proxy_pass http://backend:8080; }
 location = /runtime-config.json { try_files $uri =404; add_header Cache-Control "no-store, max-age=0"; }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 # 실제 SPA 화면 경로만 fallback. 누락된 파일/API 응답을 HTML 200으로 숨기지 않습니다.
 location ~ ^/(news|transit|calendar|login|signup|my|settings|onboarding|explore)/?$ { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
 location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
 location / { try_files $uri =404; }
}
