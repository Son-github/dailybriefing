server {
  listen 80;
  server_name localhost;

  # API Gateway 컨테이너가 재생성돼도 새 Docker DNS 주소를 다시 조회한다.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # 운영은 CloudFront가 처리하고, 로컬 Docker에서는 동일 경로를 API gateway로 전달한다.
  location ~ ^/(auth|exchange|weather|news)(/|$) {
    set $api_gateway http://api-gateway:8080;
    proxy_pass $api_gateway$request_uri;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 정적 리소스 캐시 설정 (선택)
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }
}
